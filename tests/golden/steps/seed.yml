---
# What roles/seed/tasks/main.yml renders. Fixtures set seed_hostname and
# seed_user, the facts the role derives from inventory.
- name: Render user-data
  ansible.builtin.template:
    src: "{{ golden_repo }}/roles/seed/templates/user-data.j2"
    dest: "{{ golden_case_out }}/user-data"
    mode: "0644"

- name: Render meta-data
  ansible.builtin.template:
    src: "{{ golden_repo }}/roles/seed/templates/meta-data.j2"
    dest: "{{ golden_case_out }}/meta-data"
    mode: "0644"
