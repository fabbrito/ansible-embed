---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Apply the journal location

# The unit pulls the volume in (`RequiresMountsFor`), and mounting before
# journald restarts is what puts its directory on the stick.
- name: Mount the journal
  ansible.builtin.systemd_service:
    name: var-log-journal.mount
    state: started
    enabled: true
  listen: Apply the journal location

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  listen: Apply the journal location

# Moves this boot's entries from /run onto the storage volume. Only ever runs
# when something above changed, so a second converge reports nothing.
- name: Flush the runtime journal
  ansible.builtin.command: journalctl --flush
  changed_when: true
  when: not ansible_check_mode
  listen: Apply the journal location
