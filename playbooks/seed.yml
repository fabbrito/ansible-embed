---
# Renders a board's cloud-init seed onto its mounted boot partition, from the
# controller.
#
#   ansible-playbook fabbrito.embed.seed -e target=<board> -e seed_output_dir=<dir>
#
# The unmatched default makes a forgotten -e target= match zero hosts.
- name: Seed a board
  hosts: "{{ target | default('seed_target_unspecified') }}"
  gather_facts: false
  vars:
    # Inventory connection vars beat play keywords, and these belong to the
    # board. Play vars beat inventory: every task stays local and unprivileged.
    ansible_connection: local
    ansible_become: false
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - fabbrito.embed.seed
