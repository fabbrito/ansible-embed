---
# Tailscale's own apt repo: Debian's has no tailscale. Upgrades arrive through
# unattended-upgrades, whose origin pattern lives in `os`. install.sh picks
# /raspbian on Raspbian; that repo serves the same key and the same armhf .deb,
# so /debian covers both without a distro gate.
tailscale_repo_url: https://pkgs.tailscale.com/stable/debian

# The repo's signing key (fingerprint 2596A99EAAB33821893C0A79458CA832957F5868).
# The committed hash is the trust anchor for the first download only; after it,
# the tailscale-archive-keyring package owns the file and apt rotates it.
# Every codename's key file is the same key.
tailscale_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39

# Flags for `tailscale up` beyond ours, e.g. ["--advertise-tags=tag:board"].
# Read only on the join: changing them later does not touch a joined board.
tailscale_up_args: []

# Vault key, set in the consumer, never declared here. Absent, the role installs
# tailscale and does not join.
#   tailscale_auth_key
