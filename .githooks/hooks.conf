# This repo's whole hook policy. The engine beside it is vendored from
# fabbrito/githooks v0.2.2 — bump it by copying a newer tag, edit this.
# The version is named here and nowhere else, so a bump is one file.
schema = 1

types       = feat fix refactor chore style docs build perf test
subject_max = 72
bullet_max  = 2
body_cols   = 80

# Cross-cutting names, then one scope per role and per docs topic.
scope_fixed = repo docs deps release build tests
scope_root  = roles/*/
scope_root  = docs/*/

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes

# require is true everywhere: a gate green on every commit cannot rest on a
# lane that skipped itself. AGENTS.md says a missing linter is a failure.

# ansible refuses non-blocking descriptors and the check runs at import,
# before any flag is read — so every ansible command goes through the script,
# which reopens them once. The core floor is checked in the lane it guards.
# Golden renders, sanity and the collection build are release legs, not this.
[group ansible]
match   = *.yml *.yaml *.j2 *.cfg .ansible-lint
scope   = tree
require = true
run     = scripts/lint.sh

# .githooks/githooks is left out of match — upstream's formatting is not ours
# to grade, and a style bump upstream would go red on an old vendored copy.
[group shell]
match   = *.sh .githooks/commit-msg .githooks/pre-commit
scope   = staged
require = true
run     = shfmt -i 0 -ci -d
fix     = shfmt -i 0 -ci -w
run     = shellcheck -x

# Pinned: an upstream release must not turn the tree red, and "formatted"
# must not mean whatever npm published today. npx, not bunx — bun leaves
# stdio non-blocking and ansible then refuses to run.
[group docs]
match   = *.md *.json *.yml *.yaml
scope   = staged
require = true
run     = npx --yes prettier@3.9.8 --check
fix     = npx --yes prettier@3.9.8 --write

# A formatter's own config redefines "formatted" for every file it reaches,
# so it is the one change that pays for the whole tree. The glob is
# prettier's own: lane commands are exec'd, never passed to a shell.
[group docs-config]
match   = .prettierrc.json .prettierignore
scope   = tree
require = true
run     = npx --yes prettier@3.9.8 --check **/*.{yml,yaml,md,json}
fix     = npx --yes prettier@3.9.8 --write **/*.{yml,yaml,md,json}
