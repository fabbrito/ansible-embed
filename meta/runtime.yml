---
# The floor the roles actually need: ansible.builtin.systemd_service was
# aliased in 2.18, and the collection's roles lean on facts and modules whose
# shape is stable from there. ansible-galaxy enforces this at install time, so a
# consumer on an older core fails with a version error instead of an obscure
# module failure.
#
# No upper bound, deliberately. `>=2.18.0,<3.0.0` lints clean — the ceiling is
# expressible — but ansible-galaxy enforces this at install time, so a ceiling
# blocks every consumer who upgrades core until we cut a release, to guard
# against an incompatibility we have not seen. A core 3.x therefore lands as a
# converge failure in the consumer, not an install error, and the consumer's
# dry-run is what catches it. scripts/lint.sh checks the floor only, and repeats
# it as a literal — move both together.
requires_ansible: ">=2.18.0"
