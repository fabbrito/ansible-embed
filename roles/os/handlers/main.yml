---
# Starts sshd if it is not running; reload never drops live sessions.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

# timesyncd has no reload.
- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
